name: Deploy to GitHub Pages

# Publishes the game to the gh-pages branch on every push to the main
# development branch. GitHub Pages serves that branch at
# https://sjidok750-creator.github.io/Bubblegame/
on:
  push:
    branches:
      - claude/bubble-bobble-game-c9m0hm
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: .github
          force_orphan: true
